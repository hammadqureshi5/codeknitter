<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Gateway</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background: #f4f4f4;
            white-space: pre-wrap;
            border-radius: 8px;
        }

        .loading {
            color: #666;
        }
    </style>
</head>

<body>

    <h1>🚀 AI Gateway Prototype</h1>

    <label for="model">Select Model</label>

    <select id="model">

        <option value="gemini-3.7-flash">
            Gemini
        </option>

        <option value="gpt-4o-mini">
            OpenAI
        </option>

        <option value="deepseek-chat">
            DeepSeek
        </option>

        <option value="mistral-large-latest">
            Mistral
        </option>

    </select>


    <label for="prompt">Prompt</label>

    <textarea id="prompt" placeholder="Ask something..."></textarea>


    <button onclick="sendRequest()">
        Send Request
    </button>


    <div id="result">
        Response will appear here...
    </div>


    <script>

        async function sendRequest() {

            const model =
                document.getElementById("model").value;

            const prompt =
                document.getElementById("prompt").value;

            const result =
                document.getElementById("result");


            if (!prompt.trim()) {

                result.textContent =
                    "Please enter a prompt.";

                return;
            }


            result.textContent =
                "⏳ Sending request...";


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        model: model,
                        prompt: prompt

                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    result.textContent =
                        "❌ Error:\n" +
                        JSON.stringify(data, null, 2);

                    return;
                }


                result.textContent =
                    "Provider: " +
                    data.provider +
                    "\n\n" +

                    "Model: " +
                    data.model +
                    "\n\n" +

                    "Response:\n" +
                    data.response;

            }

            catch (error) {

                result.textContent =
                    "❌ Request failed:\n" +
                    error.message;

            }

        }

    </script>

</body>

</html>
